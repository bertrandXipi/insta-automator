server {
    listen 8080;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # HTML: jamais en cache (sinon le client garde une vieille ref vers l'ancien bundle JS)
    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
        # Par défaut, pas de cache pour les routes SPA (qui retombent sur index.html)
        add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0";
    }

    # Assets hashés par Vite (immuables) : cache long
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
